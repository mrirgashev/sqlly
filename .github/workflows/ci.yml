name: macOS build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: swift --version
      - name: Build bundled PostgreSQL
        run: ./scripts/build-postgres.sh
      - name: Test
        shell: bash
        run: |
          set -uo pipefail
          TEST_LOG="$RUNNER_TEMP/sqlly-native-test.log"
          set +e
          swift test --build-system native 2>&1 | tee "$TEST_LOG"
          PIPE_RESULTS=("${PIPESTATUS[@]}")
          TEST_STATUS="${PIPE_RESULTS[0]}"
          TEE_STATUS="${PIPE_RESULTS[1]}"
          {
            printf '%s\n' '## Native Swift tests'
            printf 'Swift test exit code: %s\n\n' "$TEST_STATUS"
            printf '%s\n' '<details><summary>Last 160 log lines</summary>' '' '````text'
            tail -n 160 "$TEST_LOG"
            printf '%s\n' '````' '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$TEST_STATUS" != 0 ]]; then
            ANNOTATION_COUNT=0
            while IFS= read -r LINE || [[ -n "$LINE" ]]; do
              case "$LINE" in
                *'✘'*|*'recorded an issue'*|*'Expectation failed'*|*'Caught error:'*|*'error:'*)
                  LINE="${LINE:0:2000}"
                  LINE="${LINE//'%'/'%25'}"
                  LINE="${LINE//$'\r'/'%0D'}"
                  LINE="${LINE//$'\n'/'%0A'}"
                  printf '::error title=Native Swift test failure::%s\n' "$LINE"
                  ANNOTATION_COUNT=$((ANNOTATION_COUNT + 1))
                  if [[ "$ANNOTATION_COUNT" -ge 20 ]]; then break; fi
                  ;;
              esac
            done < "$TEST_LOG"
          fi
          if [[ "$TEST_STATUS" != 0 ]]; then exit "$TEST_STATUS"; fi
          exit "$TEE_STATUS"
      - name: Preserve native test log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SQLLY-native-test-log
          path: ${{ runner.temp }}/sqlly-native-test.log
          if-no-files-found: ignore
      - name: Package app
        env:
          SWIFT_BUILD_SYSTEM: native
        run: ./scripts/build-app.sh
      - name: Verify app without build cache
        shell: bash
        run: |
          set -euo pipefail
          SMOKE_CHECKOUT="$PWD"
          HIDDEN_BUILD_CACHE="$(mktemp -d "$PWD/../sqlly-build-cache.XXXXXX")"
          restore_build_cache() {
            local result=$?
            trap - EXIT
            if [[ -d "$HIDDEN_BUILD_CACHE/original" ]]; then
              if [[ -e "$SMOKE_CHECKOUT/.build" ]]; then
                mv "$SMOKE_CHECKOUT/.build" "$HIDDEN_BUILD_CACHE/smoke-output"
              fi
              mv "$HIDDEN_BUILD_CACHE/original" "$SMOKE_CHECKOUT/.build"
            fi
            rm -rf "$HIDDEN_BUILD_CACHE"
            exit "$result"
          }
          trap restore_build_cache EXIT
          mv .build "$HIDDEN_BUILD_CACHE/original"
          ./dist/SQLLY.app/Contents/MacOS/SQLLY --verify-bundled-resources
          test ! -e .build
      - name: Package disk image
        run: ./scripts/package-dmg.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SQLLY-development
          path: dist/*.dmg*
